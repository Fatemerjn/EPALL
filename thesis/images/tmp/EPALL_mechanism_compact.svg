<text x="120" y="96" font-size="22px" text-anchor="middle" fill="#D55E00">forgotten path f</text>
<text x="385" y="96" font-size="22px" text-anchor="middle" fill="#0072B2">retained path r</text>
<rect x="66" y="492" width="462" height="73" rx="12" fill="#FCEFEA" stroke="#D55E00" stroke-width="2" stroke-dasharray="8 6"/>
<text x="297" y="522" font-size="21px" text-anchor="middle" fill="#D55E00" font-weight="700">Naive reset of a shared coordinate</text>
<text x="297" y="551" font-size="20px" text-anchor="middle" fill="#D55E00">causes retained-task drift.</text>
<rect x="670" y="91" width="458" height="110" rx="15" fill="#F8EDF4" stroke="#CC79A7" stroke-width="3"/>
<text x="899" y="132" font-size="25px" text-anchor="middle" fill="#CC79A7" font-weight="700">1  OVERLAP</text>
<text x="899" y="174" font-size="30px" text-anchor="middle" fill="#6F3C8F" font-style="italic">S_share = M_f ∩ M_r</text>
<line x1="899" y1="202" x2="899" y2="245" stroke="#263238" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="670" y="260" width="458" height="145" rx="15" fill="#EAF4FA" stroke="#0072B2" stroke-width="3"/>
<text x="899" y="302" font-size="25px" text-anchor="middle" fill="#0072B2" font-weight="700">2  RANK</text>
<text x="899" y="346" font-size="30px" text-anchor="middle" fill="#0072B2" font-style="italic">qᵢ = |∇ᵢ L_retain|</text>
<text x="899" y="383" font-size="20px" text-anchor="middle" fill="#69757F">use retained buffers only</text>
<line x1="899" y1="406" x2="899" y2="449" stroke="#263238" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="670" y="463" width="458" height="96" rx="15" fill="#F8EDF4" stroke="#6F3C8F" stroke-width="3"/>
<text x="899" y="504" font-size="24px" text-anchor="middle" fill="#6F3C8F" font-weight="700">3  PROTECT TOP-ρ</text>
<text x="899" y="540" font-size="24px" text-anchor="middle" fill="#6F3C8F" font-style="italic">S_crit = Top-ρ(S_share; qᵢ)</text>
<rect x="1263" y="82" width="478" height="80" rx="13" fill="#FCEFEA" stroke="#D55E00" stroke-width="3"/>
<text x="1290" y="130.0" font-size="25px" text-anchor="start" fill="#D55E00" font-weight="700">1</text>
<text x="1339" y="130.0" font-size="21px" text-anchor="start" fill="#D55E00">Delete target buffer; retire M_f</text>
<line x1="1502.0" y1="162" x2="1502.0" y2="176" stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="1263" y="184" width="478" height="80" rx="13" fill="#EAF7F2" stroke="#009E73" stroke-width="3"/>
<text x="1290" y="232.0" font-size="25px" text-anchor="start" fill="#009E73" font-weight="700">2</text>
<text x="1339" y="232.0" font-size="21px" text-anchor="start" fill="#009E73">Form M_r and cache retained anchors</text>
<line x1="1502.0" y1="264" x2="1502.0" y2="278" stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="1263" y="286" width="478" height="80" rx="13" fill="#F8EDF4" stroke="#6F3C8F" stroke-width="3"/>
<text x="1290" y="334.0" font-size="25px" text-anchor="start" fill="#6F3C8F" font-weight="700">3</text>
<text x="1339" y="334.0" font-size="21px" text-anchor="start" fill="#6F3C8F">Apply branch-dependent target reset</text>
<line x1="1502.0" y1="366" x2="1502.0" y2="380" stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="1263" y="388" width="478" height="80" rx="13" fill="#EAF4FA" stroke="#0072B2" stroke-width="3"/>
<text x="1290" y="436.0" font-size="25px" text-anchor="start" fill="#0072B2" font-weight="700">4</text>
<text x="1339" y="436.0" font-size="21px" text-anchor="start" fill="#0072B2">Retained-only repair with anchors</text>
<line x1="1502.0" y1="468" x2="1502.0" y2="482" stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="1263" y="490" width="478" height="68" rx="13" fill="#F5F7F9" stroke="#69757F" stroke-width="3"/>
<text x="1290" y="532.0" font-size="25px" text-anchor="start" fill="#69757F" font-weight="700">5</text>
<text x="1339" y="532.0" font-size="21px" text-anchor="start" fill="#69757F">Rebuild active mask; discard temporary state</text>
<rect x="1343" y="576" width="318" height="45" rx="8" fill="white" stroke="#69757F" stroke-width="1.5"/>
<text x="1502" y="606" font-size="19px" text-anchor="middle" fill="#69757F" font-style="italic">Empirical — not certified removal</text>
</svg>
