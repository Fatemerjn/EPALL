<text x="92" y="56" font-size="25px" text-anchor="start" fill="#263238" font-weight="700">Shared coordinates create interference</text>
<rect x="622" y="18" width="555" height="580" rx="18" fill="white" stroke="#E6EBEF" stroke-width="2"/>
<text x="646" y="56" font-size="28px" text-anchor="start" fill="#263238" font-weight="700">(b)</text>
<text x="694" y="56" font-size="25px" text-anchor="start" fill="#263238" font-weight="700">Select retention-sensitive overlap</text>
<rect x="1224" y="18" width="555" height="580" rx="18" fill="white" stroke="#E6EBEF" stroke-width="2"/>
<text x="1248" y="56" font-size="28px" text-anchor="start" fill="#263238" font-weight="700">(c)</text>
<text x="1296" y="56" font-size="25px" text-anchor="start" fill="#263238" font-weight="700">Protected forgetting request</text>
