<text x="1468" y="291" font-size="24px" text-anchor="middle" fill="#009E73" font-weight="700">Retained tasks</text>
<text x="1468" y="334" font-size="21px" text-anchor="middle" fill="#009E73">remain near pre-request level</text>
<line x1="1220" y1="170" x2="1282" y2="145" stroke="#D55E00" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
<line x1="1220" y1="188" x2="1282" y2="286" stroke="#009E73" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="850" y="474" font-size="20px" text-anchor="middle" fill="#69757F">Schematic lifecycle; no post-deletion learning is implied.</text>
