<text x="485" y="329" font-size="25px" text-anchor="middle" fill="#009E73" font-weight="700">{T1, T2}</text>
<line x1="610" y1="170" x2="653" y2="170" stroke="#263238" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="665" y="118" width="250" height="105" rx="16" fill="#EAF4FA" stroke="#0072B2" stroke-width="3"/>
<circle cx="870" cy="170" r="25" fill="white" stroke="#0072B2" stroke-width="3"/>
<text x="870" y="179" font-size="35px" text-anchor="middle" fill="#0072B2" font-weight="700">+</text>
<text x="770" y="181" font-size="29px" text-anchor="middle" fill="#263238" font-weight="700">Learn T3</text>
<rect x="690" y="288" width="200" height="64" rx="12" fill="#EAF7F2" stroke="#009E73" stroke-width="2"/>
<text x="790" y="329" font-size="25px" text-anchor="middle" fill="#009E73" font-weight="700">{T1, T2, T3}</text>
<line x1="915" y1="170" x2="958" y2="170" stroke="#263238" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="970" y="118" width="250" height="105" rx="16" fill="#FCEFEA" stroke="#D55E00" stroke-width="3"/>
<circle cx="1175" cy="170" r="25" fill="white" stroke="#D55E00" stroke-width="3"/>
