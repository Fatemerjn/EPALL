<text x="1166" y="326.0" font-size="17px" text-anchor="end" fill="#CC79A7">mᵢ = 1 − p</text>
<rect x="930" y="186.375" width="250" height="104.5" rx="0" fill="#FCEFEA" stroke="#D55E00" stroke-width="2.5"/>
